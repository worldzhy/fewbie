name: CI

on:
  # The template-sync gate compares registry items against fewbie-starter's
  # default branch — the same source `fewbie create` clones. That invariant is
  # only meaningful once work has landed on main, so CI runs there; dev-time
  # drift is covered by the release checklist instead.
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build -w @devbie/fewbie-cli
      - run: npm test -w @devbie/fewbie-cli
      # Registry items that also ship in fewbie-starter must stay identical to
      # the template copies, or `fewbie create` and `fewbie add` fork the same file.
      - run: npm run check:template-sync -w @devbie/fewbie-cli
