# Dependabot configuration for the fewbie frontend framework monorepo.
#
# This repo publishes @devbie/fewbie-cli. Dependabot watches npm dependencies
# and GitHub Actions so the framework stays current and CVE-clean.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - "dependencies"
    # Group patch-level bumps to reduce PR noise; minor/major stay separate
    # so breaking changes get individual review.
    groups:
      patch-updates:
        update-types:
          - "patch"
      # react and react-dom must always move in lockstep (react-dom pins a
      # peer on the exact react version). Without this group, dependabot
      # opens one PR per package and the second one fails npm ci on the
      # peer mismatch until the first is merged.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # next and eslint-config-next ship together; mismatched versions cause
      # lint/build skew.
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
    # Policy: no major upgrades by default. Majors are milestone-driven
    # (CVE / feature need / ecosystem EOL) and executed as verified
    # milestones on dev, never via automated PRs — CI cannot observe
    # behavior-level regressions (changed defaults, family lockstep,
    # cross-repo consumer impact), so a green check is not evidence.
    # Dependabot groups only aggregate patch/minor anyway, so majors
    # arrive as single-package PRs that break lockstep and occupy the
    # open-PR limit, crowding out minor/patch updates.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
      time: "05:30"
      timezone: "Asia/Shanghai"
    labels:
      - "ci"
    # Same major policy as the npm ecosystem: actions majors are
    # milestone-driven, never via automated PRs.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
